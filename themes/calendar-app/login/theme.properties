# Wely login theme.
#
# It EXTENDS Keycloak's own theme instead of replacing it: no template is copied, so nothing
# has to be ported at each Keycloak upgrade. Only a stylesheet is added, and it works through
# PatternFly's variables rather than through selectors wherever it can — a token survives a
# component update, a selector fighting the component does not.
#
# The only template here is footer.ftl, an extension point Keycloak ships empty on purpose.
parent=keycloak.v2
import=common/keycloak

# The parent's sheet first, then ours: the order decides which one wins.
styles=css/styles.css css/wely.css

locales=fr
