# Wely login theme for the master realm, the screen in front of the Keycloak admin console.
#
# It EXTENDS calendar-app rather than copying it: the layout, the fonts, the gradient and the
# monogram all come from there, so the two screens cannot drift apart. What differs is the card
# foot (no demo account here), a few words, and one small stylesheet.
parent=calendar-app
import=common/keycloak

# The parent chain resolves the first two sheets; ours comes last so it wins.
styles=css/styles.css css/wely.css css/wely-admin.css

locales=fr
